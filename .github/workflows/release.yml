name: Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: xcaddy build --with github.com/arquivo/caddy-adaptive-admission-controller=.

      - name: package
        run: |
          set -euo pipefail
          mkdir -p dist
          name="caddy-adaptive-admission-controller_${{ inputs.tag }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv caddy.exe "$name.exe"
            zip -j "dist/$name.zip" "$name.exe"
          else
            mv caddy "$name"
            tar -czf "dist/$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: caddy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" dist/* \
            --repo "${{ github.repository }}" \
            --clobber
